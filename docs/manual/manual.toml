# Oxide's manual: the chapters in order, each with its pages in order.
#
# A page is a Markdown file listed by its path from this folder; it is built to
# <file name>.html, and other pages link to it by that name ([[page:choppy-audio]]), so file
# names must differ across folders. The first page is index.md. Entries starting with "@" are
# generated from the action registry (27.6): "@mcp-reference" (every action by area),
# "@mcp-actions" (a page per area, mcp-<area>.html) and "@mcp-prompts". Every .md here but
# README.md must be listed.
# How to write pages: README.md.
#
# F1 in the app opens pages and headings by name (daw-app's help.rs, `Place::page`): keep
# their file names and headings, or change the table with them (its test fails otherwise).

[[chapter]]
title = "Welcome"
pages = ["index.md"]

[[chapter]]
title = "Getting started"
pages = [
    "getting-started/getting-started.md",
    "getting-started/main-window.md",
    "getting-started/audio-device.md",
]

