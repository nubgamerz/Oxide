[[example]]
action = "get_audio_problems"
title = "Read the list the last scan found"
notes = '''
`stale` is true (and the list empty) when there was no scan or the file's audio has changed since.
'''
setup = [
    { action = "open_audio_editor", input = '{"clip": 7}' },
    { action = "find_audio_problems", input = '{"document": 1, "kind": "click-repair", "start": 0, "end": 4800}' },
]
input = '{"document": 1}'
result = '''
{
  "count": "*",
  "kind": "click-repair",
  "problems": [
    {
      "channel": 0,
      "id": 1,
      "kind": "click-repair",
      "length": 10,
      "level_db": "*",
      "start": 432
    },
    {
      "channel": 0,
      "id": 2,
      "kind": "click-repair",
      "length": 10,
      "level_db": "*",
      "start": 868
    },
    "..."
  ],
  "stale": false
}
'''

[[example]]
action = "repair_audio_problems"
title = "Repair every problem found"
notes = '''
Or `ids`, from the list. One step of the file's own history (`undo_audio_edit` takes it back).
'''
setup = [
    { action = "open_audio_editor", input = '{"clip": 7}' },
    { action = "find_audio_problems", input = '{"document": 1, "kind": "click-repair", "start": 0, "end": 4800}' },
]
input = '{"document": 1, "all": true}'
result = '''
{
  "left": {"count": 0, "kind": "click-repair", "problems": [], "stale": false},
  "repaired": 10
}
'''
