# Examples of the diagnostics actions (daw-core's api/actions/diagnostics.rs). Each runs on a fresh copy
# of the example project; how to write them: docs/manual/README.md, "Writing the MCP manual".

[[example]]
action = "find_audio_problems"
title = "Scan a file for clicks"
notes = '''
`kind` is `click-repair` (clicks and pops, with `threshold` and `complexity`) or `clip-repair` (clipped runs, with `min_clip_size` and `tolerance`). Changes no audio. The list stays on the file until its audio changes.
'''
setup = [
    { action = "open_audio_editor", input = '{"clip": 7}' },
]
input = '{"document": 1, "kind": "click-repair", "start": 0, "end": 4800}'
result = '''
{
  "count": "*",
  "kind": "click-repair",
  "problems": [
    {
      "channel": 0,
      "id": 1,
      "kind": "click-repair",
      "length": 10,
      "level_db": "*",
      "start": 432
    },
    {
      "channel": 0,
      "id": 2,
      "kind": "click-repair",
      "length": 10,
      "level_db": "*",
      "start": 868
    },
    "..."
  ],
  "stale": false
}
'''

[[example]]
action = "find_audio_problems"
title = "Scan a file for clipped runs"
setup = [
